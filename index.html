<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF0F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pookie Space" />
    <meta name="description" content="Pookie Space 💗 Tu espacio personal y exclusivo con naimnecita, tu asistente inteligente personal ✨" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Google Fonts: Plus Jakarta Sans, Playfair Display, Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <title>Pookie Space 💗</title>

    <script>
      // Clean up rogue service workers and stale caches on localhost so Vite dev is always fresh
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var j = 0; j < names.length; j++) {
              caches.delete(names[j]);
            }
          });
        }
      }

      // Global safety net: never allow a silent white screen
      window.addEventListener('error', function(e) {
        console.error('Pookie Space Init Error:', e);
        var errDiv = document.getElementById('pookie-global-rescue');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'pookie-global-rescue';
          errDiv.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#FFF0F5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:999999;font-family:sans-serif;text-align:center;color:#4A1525;';
          errDiv.innerHTML = '<div style="font-size:48px;margin-bottom:12px;">🎀</div>' +
            '<h2 style="font-size:24px;font-weight:bold;margin-bottom:8px;">¡Tranquila, pookie! 💗</h2>' +
            '<p style="font-size:14px;margin-bottom:20px;max-width:380px;line-height:1.5;">La aplicación se está actualizando. Pulsa el botón para recargar y ver todo perfecto:</p>' +
            '<button onclick="localStorage.removeItem(\'pookie_chat_v1\');window.location.reload(true);" style="padding:14px 28px;border-radius:18px;background:linear-gradient(135deg,#FF69B4,#FF1493);color:white;border:none;font-weight:bold;cursor:pointer;font-size:15px;box-shadow:0 4px 15px rgba(255,105,180,0.4);">Abrir Pookie Space ✨</button>';
          document.body.appendChild(errDiv);
        }
      });
    </script>
  </head>
  <body class="bg-gradient-to-br from-blush-50 via-pearl-50 to-lavender-50 text-rosewood-800 font-sans antialiased min-h-screen selection:bg-pookie-200 selection:text-pookie-900 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
